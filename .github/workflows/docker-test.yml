name: Docker Test

on:
  push:
    branches: [main, webcom-scaffold]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker compose build --no-cache

      - name: Start container
        run: docker compose up -d || { docker compose logs; exit 1; }

      - name: Wait for web service
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:2032/api/debug/bridge | jq -e '.status == "ok"' >/dev/null; then
              echo "Web service up"
              exit 0
            fi
            sleep 2
          done
          echo "Web service failed to start"
          docker compose logs init-data
          docker compose logs webcom
          exit 1

      - name: Test health endpoints
        run: |
          curl -sf http://localhost:2032/api/debug/bridge | jq .
          init_id=$(docker compose ps -aq init-data)
          test "$(docker inspect --format '{{.State.ExitCode}}' "$init_id")" = "0"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:2032/api/logs)" = "401"
          curl -sf http://localhost:2032/setup | grep -qi "WebCom"
          if docker compose logs webcom | grep -q "Traceback"; then
            docker compose logs webcom
            exit 1
          fi

      - name: Reject invalid setup without locking the wizard
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:2032/setup \
            --data-urlencode 'web_user=ci' \
            --data-urlencode 'web_pass=ci' \
            --data-urlencode 'servers_json=not-json')" = "400"
          curl -sf http://localhost:2032/setup | grep -qi "WebCom"

      - name: Boot the engine with a dummy server
        run: |
          curl -sf -X POST http://localhost:2032/setup \
            --data-urlencode 'web_user=ci' \
            --data-urlencode 'web_pass=ci' \
            --data-urlencode 'servers_json=[{"shortname":"ci","host":"127.0.0.1","tcpport":1,"udpport":1,"nickname":"ci","connectOnStart":false}]'
          for i in {1..30}; do
            body=$(curl -sf http://localhost:2032/api/debug/bridge || true)
            if echo "$body" | jq -e '.ready == true and .cmd_exists == true' >/dev/null 2>&1; then
              echo "Engine ready: $body"
              exit 0
            fi
            sleep 2
          done
          echo "Engine failed to boot"
          docker compose logs webcom
          exit 1

      - name: Assert clean engine startup
        run: |
          if docker compose logs webcom | grep -q "Traceback"; then
            docker compose logs webcom
            exit 1
          fi

      - name: Test Python syntax
        run: |
          docker compose exec -T webcom python -m py_compile \
            powercom.py powercom_app.py \
            webcom/app.py webcom/tt_bridge.py webcom/config_store.py \
            webcom/auth.py webcom/pages/__init__.py \
            powercom_core/features.py TTComCmd.py triggers.py \
            upgrade_conf.py conf.py \
            mplib/conf.py mplib/mycmd.py mplib/player.py \
            geolocator.py banreq.py parmline.py

      - name: Cleanup
        if: always()
        run: docker compose down -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run shellcheck on scripts
        run: |
          if command -v shellcheck >/dev/null; then
            shellcheck *.sh 2>/dev/null || true
          fi

      - name: Check Python syntax
        run: |
          python3 -m py_compile \
            powercom.py powercom_app.py \
            webcom/app.py webcom/tt_bridge.py webcom/config_store.py \
            webcom/auth.py webcom/pages/__init__.py \
            powercom_core/features.py TTComCmd.py triggers.py \
            upgrade_conf.py conf.py \
            mplib/conf.py mplib/mycmd.py mplib/player.py \
            geolocator.py banreq.py parmline.py